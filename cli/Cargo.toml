[package]
name = "repo-tweaks-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
repo-tweaks-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["macros"] }
unicode-width = "0.2.2"

[[bin]]
name = "repo-tweaks"
path = "src/main.rs"
